name: Build and Deploy to HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            menu-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to HostGator via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          port: 21
          security: loose

      - name: Install menu-app frontend dependencies
        working-directory: menu-app/frontend
        run: npm ci

      - name: Build menu-app frontend
        working-directory: menu-app/frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.MENU_API_BASE_URL }}
        run: npm run build

      - name: Deploy menu-app frontend to HostGator via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./menu-app/frontend/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}menucraft/
          protocol: ftps
          port: 21
          security: loose
